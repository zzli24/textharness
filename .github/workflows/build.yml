name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  mac:
    name: macOS (dmg + zip)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      # identity:null —— 没证书也能出包，只是 Gatekeeper 会拦
      - name: Package macOS
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: TextHarness-macOS
          # 只传 dmg：mac 的 .zip 包对用户没意义，体积还占一半（省下载时间）
          path: release/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: TextHarness-Windows
          path: release/*.exe
          if-no-files-found: error
