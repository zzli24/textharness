name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  mac:
    name: macOS (dmg + zip)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Selftest
        run: node scripts/selftest.mjs

      - name: Markdown tests
        run: node scripts/test-markdown.mjs

      - name: Grid tests
        run: node scripts/test-grid.mjs

      - name: Model params tests
        run: node scripts/test-modelparams.mjs

      - name: Build renderer/main
        run: npm run build

      # identity:null —— 没证书也能出包，只是 Gatekeeper 会拦
      - name: Package macOS
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          # 没配这些 Secrets 时为空字符串：after-sign 钩子会自动跳过公证
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 有证书时让 electron-builder 自己签名（没证书就保持跳过，走 afterPack 的 ad-hoc）
          CSC_IDENTITY_AUTO_DISCOVERY: true

      # 验证 ad-hoc 签名是否生效（没签名时 Gatekeeper 会报"已损坏"）
      - name: Verify code signature
        run: |
          APP="release/mac-arm64/TextHarness.app"
          if [ ! -d "$APP" ]; then APP=$(find release -maxdepth 2 -name '*.app' | head -1); fi
          echo "检查 $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 || true
          echo "--- spctl 评估（unsigned/ad-hoc 会被 reject，属预期）---"
          spctl -a -vvv "$APP" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: TextHarness-macOS
          # 只传 dmg：mac 的 .zip 包对用户没意义，体积还占一半（省下载时间）
          path: release/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Selftest
        run: node scripts/selftest.mjs

      - name: Markdown tests
        run: node scripts/test-markdown.mjs

      - name: Grid tests
        run: node scripts/test-grid.mjs

      - name: Model params tests
        run: node scripts/test-modelparams.mjs

      - name: Build renderer/main
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: TextHarness-Windows
          path: release/*.exe
          if-no-files-found: error
