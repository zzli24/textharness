<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextHarness</title>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/mdThemes.css" />
    <link rel="stylesheet" href="./src/cardThemes.css" />
    <link rel="stylesheet" href="./src/chat.css" />
  </head>
  <body>
    <div id="app">
      <div id="bg-scrim" aria-hidden="true"></div>
<nav id="activity" aria-label="工具栏">
        <button class="act-btn" id="act-files" title="文件树（Ctrl+B）" aria-label="文件树">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6l2 2h6a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>
        </button>

        <button class="act-btn" id="act-diff" title="文本对比" aria-label="文本对比">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="7" height="14" rx="1.5"/><rect x="14" y="5" width="7" height="14" rx="1.5"/><path d="M7 12h2M18 12h-2"/></svg>
        </button>
        <button class="act-btn" id="act-grid" title="新建 CSV 表格" aria-label="表格">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M9 4v16M15 4v16"/></svg>
        </button>
        <span class="act-spacer"></span>
        <button class="act-btn" id="act-ai" title="AI 面板（Ctrl+J）" aria-label="AI 面板">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4L12 3z"/><path d="M18 16l.9 2.1L21 19l-2.1.9L18 22l-.9-2.1L15 19l2.1-.9L18 16z"/></svg>
        </button>
        <button class="act-btn" id="act-settings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </nav>

      <aside id="sidebar">
        <div class="side-head">
          <div class="side-search">
            <svg class="side-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
            <input id="tree-filter" type="text" placeholder="过滤" spellcheck="false" />
          </div>
          <button id="btn-quick-open" class="icon-btn" title="快速打开（Ctrl+P）">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v6h6"/><path d="M6 3h7l6 6v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>
          </button>
          <button id="btn-new-file" class="icon-btn" title="新建文件">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="btn-search-files" class="icon-btn" title="在工作区搜索 / 替换（Ctrl+Shift+F）">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M15 15l4.5 4.5"/></svg>
          </button>
        </div>
        <div id="source-tabs" class="source-tabs" role="tablist" aria-label="文件来源">
          <button type="button" class="source-tab on" data-source="local" role="tab">本地</button>
          <button type="button" class="source-tab" data-source="feishu" role="tab">飞书</button>
          <button type="button" class="source-tab" data-source="ding" role="tab">钉钉</button>
        </div>
        <button type="button" id="btn-feishu-panel" class="source-action" hidden>搜索 / 拉取飞书文档…</button>
        <div id="tree" class="tree"></div>

      </aside>

      <div id="side-resizer" class="gutter" title="拖动调整宽度"></div>


      <main id="main">
        <div id="tabbar">
          <button id="tabs-prev" class="tab-nav" title="向左滚动标签">‹</button>
          <div id="tabs"></div>
          <button id="tabs-next" class="tab-nav" title="向右滚动标签">›</button>
          <div id="tabs-spacer" title="双击新建标签"></div>
        </div>
<div id="editor-host">
          <div id="pane-left" class="editor-pane"></div>
          <div id="split-resizer" class="gutter split-gutter" title="拖动调整两栏宽度（双击恢复各半）" hidden></div>
          <div id="pane-right" class="editor-pane" hidden>
            <div id="split-head">
              <span id="split-title">右侧文档</span>
              <span id="split-dirty" class="split-dirty" hidden>●</span>
              <span class="spacer"></span>
              <button id="split-save" class="icon-btn" title="保存右侧文件（Ctrl+S）">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><path d="M8 14h8"/></svg>
              </button>
              <button id="split-close" class="icon-btn" title="关闭右侧（Esc）">✕</button>
            </div>
            <div id="split-host"></div>
          </div>
        </div>
        <div id="grid-host"></div>
      </main>

      <div id="ai-resizer" class="gutter" title="拖动调整宽度"></div>

      <section id="ai-slot">
        <header id="ai-head">
          <span id="ai-dot" class="dot" title="未连接"></span>
          <span class="ai-title">文本工坊</span>
          <span id="ai-workspace" class="ws-chip" title="agent 的工作区"></span>
          <span class="spacer"></span>
          <button id="ai-model" class="ai-model" title="点击切换模型">deepseek</button>
          <button id="ai-history" class="icon-btn" title="历史会话">🕘</button>
          <button id="ai-new" class="icon-btn" title="新建会话">＋</button>
          <button id="ai-drafts" class="icon-btn has-badge" title="归档草稿：待确认">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h7l5 5v12H6z"/><path d="M13 3.5v5h5"/><path d="M9 13h6M9 16.5h4"/></svg>
            <span id="ai-drafts-badge" class="badge" hidden>0</span>
          </button>
          <button id="ai-hide" class="icon-btn" title="收起">⟩</button>
        </header>
        <div id="ai-body">
          <div id="ai-model-menu" class="model-menu" hidden>
            <input id="model-filter" type="text" placeholder="过滤模型…" spellcheck="false" />
            <div id="model-list" class="model-list"></div>
          </div>
          <div id="ai-history-menu" class="history-menu" hidden></div>
          <div id="ai-chat" class="chat">
            <div id="ai-messages" class="messages"></div>
            <button id="ai-scroll-bottom" class="scroll-bottom" hidden title="回到底部">↓</button>
            <div id="ai-composer" class="composer">
              <div class="composer-box">
                <div id="ai-attach-row" class="composer-attach" hidden></div>
                <textarea id="ai-input" rows="1" placeholder="给 agent 派活，或直接问…"></textarea>
                <div class="composer-bar">
                  <button id="ai-attach" class="ghost-btn round-btn" title="添加图片（也可以直接粘贴或拖进来）">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                  <button id="ai-selection" class="ghost-btn round-btn" title="把编辑器里选中的文字插入到输入框（也可以直接勾选下面的「选中文字」）">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6v12"/><path d="M11 8.5h7M11 12h5M11 15.5h7"/></svg>
                  </button>
                  <label class="chip-toggle" title="发送时，把编辑器里选中的文字一起带给模型"
                    ><input type="checkbox" id="ctx-selection" /> 选中文字</label
                  >
                  <label class="chip-toggle" title="发送时，把当前打开文件的全文一起带给模型"
                    ><input type="checkbox" id="ctx-file" /> 整个文件</label
                  >
                  <label class="chip-toggle chip-knowledge" title="勾上后，这一轮 agent 才会主动查 知识库/；不勾就直接回答"
                    ><input type="checkbox" id="ctx-knowledge" /> 知识库</label
                  >
                  <span class="spacer"></span>
                  <span id="ai-usage" class="usage-chip" hidden></span>
                  <span id="ai-hint" class="hint-inline"></span>
                  <button id="ai-stop" class="ghost-btn" hidden>停止</button>
                  <button id="ai-send" class="send-btn" title="发送（Enter 发送，Shift+Enter 换行）">↑</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>



      <footer id="status">
        <span id="st-path" class="st-path">就绪</span>
        <span class="spacer"></span>
        <button id="st-card" class="st-btn icon-only hidden" title="卡片预览：把当前 Markdown 导出成图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9h10M7 13h6"/><circle cx="16.5" cy="15.5" r="1.6"/></svg>
        </button>
        <button id="st-live-md" class="st-btn icon-only hidden" title="Markdown 即时渲染（像 Typora）：光标所在行显示源码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 15.2V9.4l2.1 3 2.1-3v5.8"/><path d="M16.2 9.4v4.2"/><path d="M14.4 12l1.8 2.4 1.8-2.4"/></svg>
        </button>
        <button id="st-json" class="st-btn icon-only" title="格式化 JSON（Ctrl+Alt+J，有选中就只处理选中部分）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4c-2 0-3 1-3 3v3c0 1.5-1 2.5-2.5 2.5 1.5 0 2.5 1 2.5 2.5v3c0 2 1 3 3 3"/><path d="M15 4c2 0 3 1 3 3v3c0 1.5 1 2.5 2.5 2.5-1.5 0-2.5 1-2.5 2.5v3c0 2-1 3-3 3"/></svg>
        </button>
        <button id="st-tools" class="st-btn icon-only" title="文本工具：去重、排序、编码、提取（点开选，作用于选中内容）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3.2 7.4h8.1M16.5 7.4h4.3M3.2 16.6h4.3M12.6 16.6h8.2"/><circle cx="13.9" cy="7.4" r="2.3"/><circle cx="10" cy="16.6" r="2.3"/></svg>
        </button>
        <button id="st-source" class="st-btn icon-only" title="在表格视图和源码之间切换">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-4 5 4 5"/><path d="M15 7l4 5-4 5"/></svg>
        </button>
        <button id="st-newgrid" class="st-btn icon-only" title="新建 CSV 表格">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M9.5 9.5V20M15 4v5"/></svg>
        </button>
        <button id="st-update" class="st-btn upd-chip hidden" title="有新版本">
          <span id="st-update-text">有新版本</span>
        </button>
        <button id="st-diff" class="st-btn icon-only" title="文本对比（对比两段文本或两个文件）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="7" height="14" rx="1.5"/><rect x="14" y="5" width="7" height="14" rx="1.5"/><path d="M7 12h2M18 12h-2"/></svg>
        </button>
        <button id="st-column" class="st-btn icon-only" title="列选择模式（也可以按住 Alt 拖拽）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="4" width="6" height="16" rx="1.2"/><rect x="14" y="4" width="6" height="16" rx="1.2"/></svg>
        </button>
        <select id="st-encoding" class="st-select" title="文件编码">
          <option value="utf8">UTF-8</option>
          <option value="gb18030">GBK</option>
          <option value="utf16le">UTF-16 LE</option>
          <option value="utf16be">UTF-16 BE</option>
        </select>
        <button id="st-eol" class="st-btn" title="换行符（点击切换）">CRLF</button>
        <span id="st-pos" class="st-item">Ln 1, Col 1</span>
        <span id="st-lines" class="st-item">1 行</span>
        <span id="st-version" class="st-item st-version"></span>
        <span id="st-dirty" class="st-item"></span>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
