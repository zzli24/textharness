appId: com.textharness.app
productName: TextHarness
copyright: TextHarness

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true
compression: maximum

# 只保留中英两种 Chromium 语言包：55 个 locale 占 40 MB，其实只用得上这两个
electronLanguages:
  - zh-CN
  - en-US

# 注册文件关联：装完之后 Windows 的「打开方式」里才会出现 TextHarness，
# 否则双击 .sql/.md 只会推荐装了这些扩展名的其它编辑器
fileAssociations:
  - ext: md
    name: Markdown 文档
    description: Markdown 文档
    role: Editor
    icon: build/icon.ico
  - ext: txt
    name: 文本文件
    description: 纯文本文件
    role: Editor
    icon: build/icon.ico
  - ext: log
    name: 日志文件
    description: 日志文件
    role: Editor
    icon: build/icon.ico
  - ext: json
    name: JSON 文件
    description: JSON 文件
    role: Editor
    icon: build/icon.ico
  - ext: csv
    name: CSV 表格
    description: CSV 表格
    role: Editor
    icon: build/icon.ico
  - ext: sql
    name: SQL 脚本
    description: SQL 脚本
    role: Editor
    icon: build/icon.ico
  - ext: ini
    name: 配置文件
    description: INI 配置文件
    role: Editor
    icon: build/icon.ico
  - ext: yaml
    name: YAML 文件
    description: YAML 文件
    role: Editor
    icon: build/icon.ico
  - ext: yml
    name: YAML 文件
    description: YAML 文件
    role: Editor
    icon: build/icon.ico

# 自动更新：产物和 latest.yml / latest.json 一起放到这个地址
# （服务器 47.109.100.9 的 /var/www/textharness/updates 目录）
publish:
  - provider: generic
    url: http://47.109.100.9/updates

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TextHarness
  # 控制面板「应用和功能」里的显示名
  uninstallDisplayName: ${productName} ${version}
  # 卸载时保留用户配置、工作区索引和知识库（数据比程序重要）
  deleteAppDataOnUninstall: false

# 无证书时给 macOS 包补一个 ad-hoc 签名：
# 否则「已隔离 + 零签名」会被 Gatekeeper 判成「已损坏」
afterPack: scripts/after-pack.cjs

# 配了 Apple 凭据时自动公证（没有就跳过，见 docs/apple-signing.md）
afterSign: scripts/notarize.cjs

# macOS：需在 macOS 或 macOS Runner 上构建（dmg 依赖 hdiutil）
mac:
  category: public.app-category.productivity
  # macOS 用 icns（png 在 CI 上转换会找不到 build/icon.icns）
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 没有 Apple 开发者证书：electron-builder 不签名，改由 after-pack.cjs 做 ad-hoc 签名
  identity: null
  # 公证要求 hardened runtime = true；现在没有证书，先保持 false（ad-hoc 签名可以正常打开）。
  # 配好 Apple 证书后把这里改成 true，公证才能通过。
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true

dmg:
  title: ${productName} ${version}

linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
